# full chip erase script for openocd for STM32H7x MCUs (H743, H753, H750, ...)
source [find target/stm32h7x_dual_bank.cfg]
init
reset halt
echo "Mass erasing bank 1"
stm32h7x mass_erase 0
# single bank parts (e.g. H750) have no second bank
if {[catch {stm32h7x mass_erase 1} err]} {
    echo "No second flash bank: $err"
} else {
    echo "Mass erased bank 2"
}
echo "Success!"
reset
exit
