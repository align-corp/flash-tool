# full chip erase script for openocd for STM32L4x MCUs (L431, L432, L433, ...)
# also removes read and write protection set by openocd-lock.cfg
source [find target/stm32l4x.cfg]

set FLASH_CR      0x40022014
set FLASH_KEYR    0x40022008
set FLASH_OPTKEYR 0x4002200C

set KEY1 0x45670123
set KEY2 0xCDEF89AB
set OPT_KEY1 0x08192A3B
set OPT_KEY2 0x4C5D6E7F

# function to wait for some bits to clear
proc wait_till_clear { register bits } {
    # always wait 10ms
    sleep 10
    set v [mrw $register]
    while {[expr {$v & $bits}] != 0} {
        #echo "reg [format 0x%08x $register] [format 0x%08x $v] [format 0x%08x $bits]"
        sleep 1
        set v [mrw $register]
    }
}

init
reset halt

echo "removing read protection"
stm32l4x unlock 0

echo "removing write protection"
flash protect 0 0 last off

echo "unlocking flash"
mww $FLASH_KEYR $KEY1
mww $FLASH_KEYR $KEY2

echo "unlocking option"
mww $FLASH_OPTKEYR $OPT_KEY1
mww $FLASH_OPTKEYR $OPT_KEY2

# option reload applies the new protection settings; going from read
# protection level 1 to level 0 also triggers a hardware mass erase
echo "option reload"
mww $FLASH_CR 0x08000000
wait_till_clear $FLASH_CR 0x08000000
reset

echo "resetting"
sleep 500
reset halt

echo "Mass erasing flash"
stm32l4x mass_erase 0

echo "Success!"
reset
exit
