name: CI Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build CI
        run: uv run package/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item "dist/flash-tool.exe" Align_flash_tool.exe
          Compress-Archive -Path Align_flash_tool.exe -DestinationPath Align_flash_tool_${{ matrix.os }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: zip Align_flash_tool_${{ matrix.os }}.zip "dist/flash-tool"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: zip -r Align_flash_tool_${{ matrix.os }}.zip "dist/flash-tool.app"

      - name: Archive build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: Align_flash_tool_${{ matrix.os }}.zip
          retention-days: 7

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: build
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release for ${{ github.ref_name }}" \
            build/*
